<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#142240"/>
      <stop offset="100%" stop-color="#080e1e"/>
    </radialGradient>

    <!-- Spectrum arc gradient -->
    <linearGradient id="spectrumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E84393"/>
      <stop offset="25%" stop-color="#FF6B6B"/>
      <stop offset="50%" stop-color="#F5A623"/>
      <stop offset="75%" stop-color="#F8E71C"/>
      <stop offset="100%" stop-color="#55EFC4"/>
    </linearGradient>

    <!-- Needle gradient -->
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>

    <!-- Glow filter for the arc -->
    <filter id="arcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Stronger glow for needle -->
    <filter id="needleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Soft glow for center dot -->
    <filter id="centerGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle star glow -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Clip for rounded corners -->
    <clipPath id="roundedClip">
      <rect width="1024" height="1024" rx="220" ry="220"/>
    </clipPath>
  </defs>

  <!-- Clipped content -->
  <g clip-path="url(#roundedClip)">
    <!-- Background -->
    <rect width="1024" height="1024" fill="url(#bgGrad)"/>

    <!-- Subtle star dots -->
    <g filter="url(#starGlow)" opacity="0.4">
      <circle cx="180" cy="200" r="2.5" fill="#74B9FF"/>
      <circle cx="850" cy="180" r="2" fill="#A29BFE"/>
      <circle cx="320" cy="120" r="1.8" fill="#FFFFFF"/>
      <circle cx="700" cy="140" r="2.2" fill="#55EFC4"/>
      <circle cx="150" cy="400" r="1.5" fill="#F8E71C"/>
      <circle cx="880" cy="420" r="2" fill="#FF6B6B"/>
      <circle cx="250" cy="750" r="1.8" fill="#74B9FF"/>
      <circle cx="780" cy="780" r="2" fill="#A29BFE"/>
      <circle cx="500" cy="150" r="2.5" fill="#FFFFFF"/>
      <circle cx="900" cy="600" r="1.5" fill="#55EFC4"/>
      <circle cx="120" cy="600" r="2" fill="#F5A623"/>
      <circle cx="600" cy="850" r="1.8" fill="#74B9FF"/>
      <circle cx="400" cy="880" r="2" fill="#E84393"/>
    </g>

    <!-- Outer subtle ring -->
    <path d="M 222 590 A 300 300 0 0 1 802 590"
          fill="none" stroke="#1A2744" stroke-width="60"
          stroke-linecap="round"/>

    <!-- Spectrum arc background (thicker, muted) -->
    <path d="M 222 590 A 300 300 0 0 1 802 590"
          fill="none" stroke="url(#spectrumGrad)" stroke-width="44" opacity="0.2"
          stroke-linecap="round"/>

    <!-- Main spectrum arc with glow -->
    <g filter="url(#arcGlow)">
      <!-- Individual colored segments for a more modern look -->
      <!-- Segment 1: Pink -->
      <path d="M 222 590 A 300 300 0 0 1 282 412"
            fill="none" stroke="#E84393" stroke-width="28"
            stroke-linecap="round" opacity="0.9"/>
      <!-- Segment 2: Coral -->
      <path d="M 290 400 A 300 300 0 0 1 400 318"
            fill="none" stroke="#FF6B6B" stroke-width="28"
            stroke-linecap="round" opacity="0.9"/>
      <!-- Segment 3: Orange -->
      <path d="M 408 314 A 300 300 0 0 1 512 290"
            fill="none" stroke="#F5A623" stroke-width="28"
            stroke-linecap="round" opacity="0.9"/>
      <!-- Segment 4: Yellow -->
      <path d="M 520 290 A 300 300 0 0 1 630 316"
            fill="none" stroke="#F8E71C" stroke-width="28"
            stroke-linecap="round" opacity="0.9"/>
      <!-- Segment 5: Mint/Green -->
      <path d="M 638 320 A 300 300 0 0 1 740 404"
            fill="none" stroke="#AAC573" stroke-width="28"
            stroke-linecap="round" opacity="0.9"/>
      <!-- Segment 6: Teal -->
      <path d="M 746 414 A 300 300 0 0 1 802 590"
            fill="none" stroke="#55EFC4" stroke-width="28"
            stroke-linecap="round" opacity="0.9"/>
    </g>

    <!-- Tick marks on the arc -->
    <g stroke="#FFFFFF" stroke-width="2" opacity="0.3">
      <line x1="237" y1="530" x2="255" y2="540" />
      <line x1="270" y1="440" x2="290" y2="448" />
      <line x1="340" y1="360" x2="356" y2="374" />
      <line x1="425" y1="308" x2="435" y2="325" />
      <line x1="512" y1="290" x2="512" y2="308" />
      <line x1="600" y1="308" x2="590" y2="325" />
      <line x1="684" y1="360" x2="668" y2="374" />
      <line x1="754" y1="440" x2="734" y2="448" />
      <line x1="787" y1="530" x2="769" y2="540" />
    </g>

    <!-- Needle pointing ~120 degrees (upper-right area) -->
    <g filter="url(#needleGlow)">
      <line x1="512" y1="590" x2="680" y2="370"
            stroke="url(#needleGrad)" stroke-width="6"
            stroke-linecap="round"/>
      <!-- Needle tip glow dot -->
      <circle cx="680" cy="370" r="6" fill="#FFFFFF" opacity="0.9"/>
    </g>

    <!-- Center pivot -->
    <g filter="url(#centerGlow)">
      <circle cx="512" cy="590" r="18" fill="#F5A623" opacity="0.6"/>
      <circle cx="512" cy="590" r="10" fill="#FFFFFF"/>
    </g>

    <!-- Bottom decorative line -->
    <line x1="320" y1="620" x2="704" y2="620"
          stroke="#1A2744" stroke-width="2" opacity="0.5"/>
  </g>
</svg>
