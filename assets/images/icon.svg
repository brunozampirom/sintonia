<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#0a0618"/>
    </radialGradient>

    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF006E"/>
      <stop offset="30%" stop-color="#FF4D6D"/>
      <stop offset="60%" stop-color="#FF8500"/>
      <stop offset="100%" stop-color="#FFBE0B"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFBE0B"/>
      <stop offset="40%" stop-color="#8AC926"/>
      <stop offset="100%" stop-color="#06D6A0"/>
    </linearGradient>
    <linearGradient id="wave3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06D6A0"/>
      <stop offset="40%" stop-color="#118AB2"/>
      <stop offset="100%" stop-color="#7B2FF7"/>
    </linearGradient>
    <linearGradient id="wave4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B2FF7"/>
      <stop offset="50%" stop-color="#C77DFF"/>
      <stop offset="100%" stop-color="#FF006E"/>
    </linearGradient>

    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#FFBE0B" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#FF006E" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF006E" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF006E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF006E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B2FF7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7B2FF7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06D6A0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06D6A0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFBE0B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFBE0B" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="medGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <clipPath id="clip">
      <rect width="1024" height="1024" rx="220" ry="220"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1024" height="1024" fill="url(#bg)"/>

    <!-- Ambient color blobs -->
    <circle cx="200" cy="350" r="300" fill="url(#glow1)"/>
    <circle cx="800" cy="300" r="280" fill="url(#glow2)"/>
    <circle cx="700" cy="700" r="250" fill="url(#glow3)"/>
    <circle cx="300" cy="700" r="220" fill="url(#glow4)"/>

    <!-- Background wave blurs (wide, atmospheric) -->
    <g filter="url(#bigGlow)" opacity="0.4">
      <path d="M -80 700 C 80 320, 280 800, 512 480 C 744 160, 940 650, 1104 300"
            fill="none" stroke="url(#wave1)" stroke-width="90" stroke-linecap="round"/>
    </g>
    <g filter="url(#bigGlow)" opacity="0.35">
      <path d="M -50 500 C 200 700, 350 300, 512 530 C 674 760, 820 350, 1074 550"
            fill="none" stroke="url(#wave2)" stroke-width="75" stroke-linecap="round"/>
    </g>
    <g filter="url(#bigGlow)" opacity="0.35">
      <path d="M -50 440 C 180 620, 320 280, 512 490 C 704 700, 850 320, 1074 470"
            fill="none" stroke="url(#wave3)" stroke-width="65" stroke-linecap="round"/>
    </g>

    <!-- Crisp foreground waves (thicker for small icon readability) -->
    <!-- Wave 1: S-shape (Sintonia) -->
    <g filter="url(#softGlow)">
      <path d="M -60 700 C 90 340, 280 780, 512 480 C 744 180, 930 630, 1084 300"
            fill="none" stroke="url(#wave1)" stroke-width="28" stroke-linecap="round" opacity="0.9"/>
    </g>
    <g filter="url(#softGlow)">
      <path d="M -30 495 C 190 670, 340 340, 512 525 C 684 710, 830 370, 1054 530"
            fill="none" stroke="url(#wave2)" stroke-width="22" stroke-linecap="round" opacity="0.85"/>
    </g>
    <g filter="url(#softGlow)">
      <path d="M -30 460 C 170 610, 330 310, 512 490 C 694 670, 840 340, 1054 480"
            fill="none" stroke="url(#wave3)" stroke-width="16" stroke-linecap="round" opacity="0.8"/>
    </g>
    <g filter="url(#medGlow)">
      <path d="M -30 530 C 180 350, 350 640, 512 450 C 674 260, 840 580, 1054 430"
            fill="none" stroke="url(#wave4)" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
    </g>

    <!-- Central bright orb (bigger for icon readability) -->
    <circle cx="512" cy="485" r="160" fill="url(#orb)"/>
    <circle cx="512" cy="485" r="52" fill="white" opacity="0.95"/>
    <circle cx="512" cy="485" r="28" fill="white" opacity="0.4"/>

    <!-- Particle dots -->
    <g opacity="0.6">
      <circle cx="180" cy="280" r="3.5" fill="#FF006E"/>
      <circle cx="320" cy="200" r="2.5" fill="#FFBE0B"/>
      <circle cx="700" cy="220" r="3" fill="#7B2FF7"/>
      <circle cx="830" cy="380" r="2.5" fill="#06D6A0"/>
      <circle cx="150" cy="600" r="2.5" fill="#118AB2"/>
      <circle cx="400" cy="150" r="2" fill="#C77DFF"/>
      <circle cx="620" cy="830" r="2.5" fill="#FF4D6D"/>
      <circle cx="870" cy="650" r="2" fill="#FFBE0B"/>
      <circle cx="250" cy="820" r="2.5" fill="#8AC926"/>
      <circle cx="760" cy="800" r="3" fill="#FF006E"/>
      <circle cx="440" cy="860" r="2" fill="#118AB2"/>
      <circle cx="580" cy="180" r="2.5" fill="#06D6A0"/>
      <circle cx="900" cy="500" r="2.5" fill="#C77DFF"/>
      <circle cx="120" cy="450" r="2" fill="#FF8500"/>
    </g>

    <!-- Subtle ring echoes -->
    <circle cx="512" cy="485" r="100" fill="none" stroke="white" stroke-width="1.2" opacity="0.12"/>
    <circle cx="512" cy="485" r="170" fill="none" stroke="white" stroke-width="0.8" opacity="0.06"/>
  </g>
</svg>
