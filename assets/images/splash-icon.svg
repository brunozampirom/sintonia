  <!-- Waves + central orb (1024 design space, translated into the portrait canvas). -->
  <g transform="translate(28, 615)">
    <g transform="translate(0, -120)">
      <g filter="url(#softGlow)">
        <path d="M -120 700 C 90 340, 280 780, 512 480 C 744 180, 930 630, 1144 300"
              fill="none" stroke="url(#wave1)" stroke-width="28" stroke-linecap="round" opacity="0.9"/>
      </g>
      <g filter="url(#softGlow)">
        <path d="M -120 495 C 190 670, 340 340, 512 525 C 684 710, 830 370, 1144 530"
              fill="none" stroke="url(#wave2)" stroke-width="22" stroke-linecap="round" opacity="0.85"/>
      </g>
      <g filter="url(#softGlow)">
        <path d="M -120 460 C 170 610, 330 310, 512 490 C 694 670, 840 340, 1144 480"
              fill="none" stroke="url(#wave3)" stroke-width="16" stroke-linecap="round" opacity="0.8"/>
      </g>
      <g filter="url(#medGlow)">
        <path d="M -120 530 C 180 350, 350 640, 512 450 C 674 260, 840 580, 1144 430"
              fill="none" stroke="url(#wave4)" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
      </g>
